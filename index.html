<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rememorio Blog</title>
    <meta
      name="description"
      content="源码阅读与工程笔记目录。"
    />
    <meta name="theme-color" content="#f6f4ef" />
    <link rel="stylesheet" href="./hermes-agent/styles.css" />
    <style>
      .blog-home {
        max-width: 1120px;
        margin: 0 auto;
        padding: clamp(36px, 7vw, 92px) clamp(18px, 4vw, 52px) 88px;
      }

      .home-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 420px);
        gap: clamp(30px, 6vw, 76px);
        align-items: center;
        min-height: 56vh;
      }

      .home-hero h1 {
        font-size: clamp(46px, 8vw, 88px);
      }

      .home-hero p {
        max-width: 680px;
      }

      .home-visual {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #151817;
        box-shadow: var(--shadow);
      }

      .home-visual img {
        display: block;
        width: 100%;
        min-height: 300px;
        object-fit: cover;
      }

      .posts {
        margin-top: 44px;
        padding-top: 42px;
        border-top: 1px solid var(--line);
      }

      .post-list {
        display: grid;
        gap: 16px;
        margin-top: 24px;
      }

      .post-card {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr) auto;
        gap: 18px;
        align-items: center;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        color: var(--ink);
        text-decoration: none;
      }

      .post-card:hover {
        border-color: var(--teal);
        color: var(--ink);
        transform: translateY(-1px);
      }

      .post-card .tag {
        color: var(--gold);
        font-size: 13px;
        font-weight: 800;
      }

      .post-card strong {
        display: block;
        margin-bottom: 6px;
        font-size: 22px;
      }

      .post-card p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }

      .post-card .arrow {
        color: var(--teal);
        font-size: 24px;
      }

      @media (max-width: 760px) {
        .home-hero,
        .post-card {
          grid-template-columns: 1fr;
        }

        .home-visual {
          order: 2;
        }

        .post-card .arrow {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="博客首页">
        <span class="brand-mark">R</span>
        <span>Rememorio Blog</span>
      </a>
      <nav aria-label="页面导航">
        <a href="#posts">文章</a>
        <a href="https://github.com/Rememorio/blog">GitHub</a>
      </nav>
    </header>

    <main class="blog-home">
      <section class="home-hero">
        <div>
          <p class="eyebrow">源码阅读与工程笔记</p>
          <h1>
            <span>把复杂系统</span>
            <span>拆成能讲清的路径</span>
          </h1>
          <p class="lead">
            这里记录源码阅读、架构分析和工程实践。每组文章尽量从一个核心问题出发，
            先建立地图，再沿关键链路进入细节，最后回到可复述的结构。
          </p>
        </div>
        <div class="home-visual" aria-hidden="true">
          <img src="./hermes-agent/assets/hermes-banner.png" alt="" />
        </div>
      </section>

      <section id="posts" class="posts">
        <p class="section-kicker">目录</p>
        <h2>文章</h2>
        <div class="post-list">
          <a class="post-card" href="./hermes-agent/">
            <span class="tag">源码阅读</span>
            <span>
              <strong>Hermes Agent：自进化 Agent 是怎样长出来的</strong>
              <p>
                从闭环学习出发，拆解 memory、skills、session_search、background review、
                curator 和运行时触发链路。
              </p>
            </span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Rememorio Blog</p>
      <a href="#posts">查看目录</a>
    </footer>
  </body>
</html>
