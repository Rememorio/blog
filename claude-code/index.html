    <style>
      .language-gate {
        width: min(100%, 1120px);
        margin: 0 auto;
        padding: clamp(34px, 6vw, 74px) clamp(18px, 4vw, 52px) 90px;
      }

      .language-gate .lead {
        max-width: 820px;
      }

      .language-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 18px;
        margin-top: 30px;
      }

      .language-card {
        display: grid;
        min-height: 180px;
        padding: clamp(18px, 3vw, 26px);
        border: 1px solid rgba(24, 55, 82, 0.16);
        border-radius: 8px;
        background: rgba(255, 250, 240, 0.88);
        color: var(--ink);
        text-decoration: none;
        box-shadow: 0 12px 28px rgba(38, 45, 52, 0.07);
      }

      .language-card:hover {
        border-color: var(--teal);
        color: var(--ink);
        transform: translateY(-1px);
      }

      .language-card .tag {
        color: var(--gold);
        font-size: 13px;
        font-weight: 850;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .language-card strong {
        display: block;
        margin: 12px 0 8px;
        color: var(--navy);
        font-size: clamp(24px, 3vw, 32px);
        line-height: 1.24;
      }

      .language-card p {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.65;
      }

      .language-cover {
        overflow: hidden;
        margin-top: clamp(30px, 5vw, 52px);
        border: 1px solid rgba(24, 55, 82, 0.14);
        border-radius: 8px;
        background: rgba(255, 250, 240, 0.7);
        box-shadow: 0 14px 34px rgba(38, 45, 52, 0.09);
      }

      .language-cover img {
        display: block;
        width: 100%;
      }
    </style>
    <script>
      (() => {
        if (!window.location.hash) return;
        const target = new URL("./zh/overview/", window.location.href);
        target.search = window.location.search;
        target.hash = window.location.hash;
        window.location.replace(target.href);
      })();
    </script>

    <main class="language-gate">
