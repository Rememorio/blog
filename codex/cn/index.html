    <style>
      .series-shell {
        width: min(100%, 1120px);
        margin: 0 auto;
        padding: clamp(34px, 6vw, 74px) clamp(18px, 4vw, 52px) 90px;
      }

      .series-grid {
        display: grid;
        gap: 18px;
        margin-top: 30px;
      }

      .series-card {
        display: grid;
        grid-template-columns: minmax(220px, 360px) minmax(0, 1fr);
        gap: clamp(18px, 4vw, 34px);
        align-items: center;
        padding: clamp(16px, 3vw, 24px);
        border: 1px solid rgba(24, 55, 82, 0.16);
        border-radius: 8px;
        background: rgba(255, 250, 240, 0.88);
        color: var(--ink);
        text-decoration: none;
        box-shadow: 0 12px 28px rgba(38, 45, 52, 0.07);
      }

      .series-card:hover {
        border-color: var(--teal);
        color: var(--ink);
        transform: translateY(-1px);
      }

      .series-card img {
        display: block;
        width: 100%;
        border: 1px solid rgba(24, 55, 82, 0.12);
        border-radius: 8px;
      }

      .series-card strong {
        display: block;
        color: var(--navy);
        font-size: clamp(24px, 3vw, 34px);
        line-height: 1.28;
      }

      .series-card p {
        color: var(--muted);
      }

      @media (max-width: 760px) {
        .series-card {
          grid-template-columns: 1fr;
        }
      }
    </style>

      </p>
